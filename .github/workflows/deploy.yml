name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 빌드나 검사가 하나라도 실패하면 이 job이 실패하고 deploy job은 돌지 않는다 (기존 사이트 유지)
      - run: npm run build
      - name: 빌드 결과 검사
        env:
          FORBIDDEN_PATTERN: ${{ secrets.FORBIDDEN_PATTERN }}
        run: |
          test -f dist/index.html
          ls dist/assets/index-*.js
          grep -q 'src="/assets/index-' dist/index.html
          if grep -q '/src/main.js' dist/index.html; then echo "원본 엔트리가 남아 있음"; exit 1; fi
          # 공개 금지 문구 목록은 저장소가 아닌 Actions 비밀값(FORBIDDEN_PATTERN)에 둔다
          if [ -n "$FORBIDDEN_PATTERN" ] && grep -r -l -i -E "$FORBIDDEN_PATTERN" dist; then echo "공개 금지 문구 발견"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 배포 후 스모크 체크 (200 + /assets/ 번들)
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o page.html -w '%{http_code}' "${SITE}?smoke=${GITHUB_RUN_ID}-$i")
            js=$(grep -o 'src="/assets/index-[^"]*\.js"' page.html | head -1 | sed 's/src="//; s/"$//')
            if [ "$code" = "200" ] && [ -n "$js" ]; then
              jscode=$(curl -s -o /dev/null -w '%{http_code}' "${SITE%/}${js}")
              if [ "$jscode" = "200" ]; then echo "통과: 페이지 $code, 번들 $js $jscode"; exit 0; fi
            fi
            echo "대기 $i: 페이지 $code, 번들 '${js}'"; sleep 10
          done
          echo "스모크 체크 실패"; exit 1
